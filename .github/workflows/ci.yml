name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # One macOS job: macOS minutes are billed at ten times the Linux rate
          # while the repository is private.
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --python ${{ matrix.python }}
      - name: Lint
        run: uv run ruff check .
      - name: Test
        # No test calls the Anthropic API; no key is configured here.
        run: uv run pytest -q

  install:
    # Runs the one-line installer from this checkout on a machine with no uv, then
    # checks that the installed command works outside the repository.
    name: installer, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Run install.sh
        if: runner.os != 'Windows'
        run: sh install.sh
      - name: Run install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1
      - name: Use the installed command
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          clm-harness --help
          clm-harness sessions --dir .
          echo "sk-ant-not-a-real-key" | clm-harness setup --key-stdin --offline
          clm-harness doctor --offline
