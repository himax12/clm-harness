[project]
name = "clm-harness"
version = "0.1.0"
description = "A bash-only coding-agent harness in which the model manages its own context by editing a file"
requires-python = ">=3.12"
dependencies = ["anthropic>=1.0"]

[project.scripts]
harness = "harness.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
