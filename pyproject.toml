[project]
name = "clm-harness"
version = "0.1.0"
description = "A bash-only coding-agent harness in which the model manages its own context by editing a file"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["anthropic>=1.8,<2"]

[project.scripts]
harness = "harness.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# Tests hold long literal commands and expected strings; wrapping them hurts more than it helps.
"tests/*" = ["E501", "B007"]
